<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}apply-bot{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
  <strong>apply-bot</strong>
  <a href="{{ url_for('index') }}">Dashboard</a>
  <a href="{{ url_for('jobs') }}">Jobs</a>
  <a href="{{ url_for('jobs', decision='review') }}">Review Queue</a>
  <a href="{{ url_for('applications') }}">Applications</a>
  <a href="{{ url_for('runs') }}">Runs</a>
  <a href="{{ url_for('profile') }}">Profile & Auth</a>
</nav>
<main>
{% with messages = get_flashed_messages() %}
  {% if messages %}
  <div class="flash">{% for m in messages %}<p>{{ m }}</p>{% endfor %}</div>
  {% endif %}
{% endwith %}
{% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
