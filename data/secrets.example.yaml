# Local secrets and provider credentials (never committed to git)
# Copy this file to data/secrets.yaml:
#   cp data/secrets.example.yaml data/secrets.yaml
#
# Values defined here override data/config.yaml.

llm:
  endpoint: https://api.openai.com/v1   # e.g. https://openrouter.ai/api/v1 or http://localhost:20128/v1
  prefix: ""                            # e.g. "openai/" or "deepseek/"
  model: gpt-4o-mini                    # e.g. ag/gemini-3.7-flash-high or meta-llama/llama-3.3-70b-instruct
  api_key: ""                           # your API key, or leave blank to use OPENAI_API_KEY env var
