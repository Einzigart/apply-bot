# Local secrets and provider credentials (never committed to git)
# Copy this file to data/secrets.yaml:
#   cp data/secrets.example.yaml data/secrets.yaml
#
# Values defined here override data/config.yaml.

llm:
  provider: openai                      # openai | claude | codex | copilot | gemini
  endpoint: https://api.openai.com/v1   # only needed if provider is openai
  prefix: ""                            # e.g. "openai/" or "deepseek/"
  model: gpt-4o-mini                    # e.g. claude-3-5-sonnet-20241022 or gpt-4o or gemini-2.5-flash
  api_key: ""                           # your API key for openai provider, or leave blank
