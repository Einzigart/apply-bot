[project]
name = "apply-bot"
version = "0.1.0"
description = "Script-first Jobstreet Indonesia application pipeline (scrape, filter, score, apply)"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0.0"]
dev = ["pytest>=8", "pypdf>=4"]
web = ["flask>=3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
