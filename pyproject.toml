[project]
name = "apply-bot"
version = "0.1.0b1"
description = "Script-first Jobstreet Indonesia application pipeline (scrape, filter, score, apply)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "openpyxl>=3.1.5",
    "playwright>=1.40",
    "pydantic>=2.0",
    "pypdf>=4.0.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.32",
    "websockets>=17.0.1",
]

[project.optional-dependencies]
llm = ["openai>=1.0.0"]
dev = ["pytest>=8", "pypdf>=4", "httpx>=0.27", "pyinstaller>=6.11.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.1",
]
